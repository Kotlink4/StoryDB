services:
  postgres:
    image: postgres:17-alpine
    container_name: storydb-postgres
    environment:
      POSTGRES_DB: storydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - storydb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: StoryDB.Api/Dockerfile
    container_name: storydb-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 5282
      ConnectionStrings__StoryDb: Host=postgres;Port=5432;Database=storydb;Username=postgres;Password=postgres
      Logging__FileDirectory: /app/logs
    ports:
      - "${API_HOST_PORT:-5282}:5282"
    volumes:
      - ${STORYDB_UPLOADS_PATH:-./data/uploads}:/app/uploads
      - ${STORYDB_DATAPROTECTION_PATH:-./data/dataprotection}:/root/.aspnet/DataProtection-Keys
      - ${STORYDB_LOGS_PATH:-./data/logs}:/app/logs

  client:
    build:
      context: .
      dockerfile: storydb.client/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ASSET_BASE_URL: ${VITE_ASSET_BASE_URL:-}
    container_name: storydb-client
    depends_on:
      - api
    ports:
      - "${CLIENT_HOST_PORT:-50201}:50201"

volumes:
  storydb_postgres_data:

