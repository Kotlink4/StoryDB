services:
  postgres:
    image: postgres:17-alpine
    container_name: storydb-postgres
    environment:
      POSTGRES_DB: storydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - storydb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storydb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storydb_postgres_data:
